[pytest]
filterwarnings =
    ignore::DeprecationWarning
testpaths = App/tests
log_cli = 1
log_cli_level = INFO
log_cli_format = %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (database, multi-component)
    api_v2: marks tests for API v2 endpoints
    performance: marks tests for performance benchmarks